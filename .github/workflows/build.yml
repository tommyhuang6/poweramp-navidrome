# Builds the APK from this repository's source, on GitHub's machines.
# - Pull requests: debug build only (no access to the signing key).
# - Pushes to main: signed release build, uploaded as a workflow artifact.
# - Tags v*: the same, plus a build attestation and a GitHub release with the APK and its SHA-256.
# Third-party actions are pinned by commit, since this job holds the signing key.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The release signing certificate. A build signed with any other key fails here.
  EXPECTED_CERT_SHA256: b43c6f623ce0704279a778cd146318a4a4961efa00ff4f0d56c36faa6e99039f

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.14.3'

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Debug build (pull requests)
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon assembleDebug

      - name: Version
        if: github.event_name != 'pull_request'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Signed release build
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::Configure the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD repository secrets."
            exit 1
          fi
          umask 077
          export SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$SIGNING_KEYSTORE"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_KEYSTORE"
          keytool -list -keystore "$SIGNING_KEYSTORE" -alias poweramp-navidrome -storepass:env SIGNING_PASSWORD > /dev/null
          gradle --no-daemon assembleRelease

      - name: Check the signature
        if: github.event_name != 'pull_request'
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" certs.txt
          name="navidrome-for-poweramp-$VERSION_NAME.apk"
          mkdir out
          cp "$apk" "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256")
          cat out/*.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: apk
          path: out/

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.apk

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --generate-notes
